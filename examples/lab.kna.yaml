# Real Thorlabs KNA-IR (K-Cube NanoTrak) for fiber-incoupling auto-alignment.
#
# Before first use:
#   1. In the Kinesis app, set both HV outputs to the 150 V range, then close
#      Kinesis (only one program can hold the device).
#   2. Serial numbers below are for the lab's KNA-IR (S/N 57535374); change
#      both if you use a different unit.
#
# Run from repo root:
#     python -m labman_app --lab examples/lab.kna.yaml
#
# To try the driver without hardware, configure a KNA101 in the Kinesis
# Simulator and add `simulation: true` under args.
version: 1
devices:
  aligner:
    driver: labman_core.drivers.KinesisNanoTrak
    role: aligner
    resource: "kinesis:57535374"
    args:
      serial_no: "57535374"
      max_voltage_v: 150
    sync_policy: hydrate
