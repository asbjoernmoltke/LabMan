[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labman"
version = "0.0.1"
description = "Lab equipment integration and measurement framework for optics labs"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Asbjorn Moltke", email = "asbmm@dtu.dk" }]
dependencies = [
    "numpy>=2.0",
    "h5py>=3.11",
]

[project.optional-dependencies]
app = [
    "PySide6>=6.8",
    "qasync>=0.27",
    "pyqtgraph>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.entry-points."labman.tasks"]
coupling_efficiency = "labman_tasks.coupling_efficiency:CouplingEfficiencyTask"

[tool.hatch.build.targets.wheel]
packages = ["src/labman_core", "src/labman_tasks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
